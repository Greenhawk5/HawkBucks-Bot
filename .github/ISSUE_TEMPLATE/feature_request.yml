name: Feature Request
description: Suggest an improvement or new capability for HawkBucks Bot.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are most useful when they describe the problem first
        and the proposed solution second.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
      placeholder: Describe the user or developer problem.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
      placeholder: Explain the proposed feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe alternative approaches or workarounds.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add examples, screenshots, diagrams, or other useful context.
